<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andy Borthwick</title>
  <style>
    :root {
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border: #334155;
      }
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 2.5rem;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }
    h1 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
      font-weight: 600;
    }
    p {
      color: var(--text-muted);
      line-height: 1.6;
      margin: 0 0 1.5rem 0;
      font-size: 0.95rem;
    }
    .links a {
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.9rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 2px;
      margin-right: 1rem;
    }
    .links a:hover {
      border-color: var(--text-main);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Andy Borthwick</h1>
    <p>Personal domain for email and communications. Feel free to connect via the links below.</p>
    <div class="links">
      <a href="https://github.com/andyborthwick" target="_blank" rel="noopener noreferrer">GitHub</a>
      <a href="https://www.linkedin.com/in/andrewborthwick/" target="_blank" rel="noopener noreferrer">LinkedIn</a>
    </div>
  </div>
</body>
</html>
