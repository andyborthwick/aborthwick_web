<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Andy Borthwick</title>
  <meta name="description" content="Andy Borthwick. Contact and links.">
  <meta property="og:title" content="Andy Borthwick">
  <meta property="og:description" content="Contact and links for Andy Borthwick.">
  <meta property="og:url" content="https://aborthwick.com/">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3EAB%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg: #f9fafb;
      --card-bg: #ffffff;
      --text-main: #111827;
      --text-muted: #6b7280;
      --accent: #2563eb;
      --border: #e5e7eb;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #0f172a;
        --card-bg: #1e293b;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --accent: #60a5fa;
        --border: #334155;
      }
    }
    :root[data-theme="dark"] {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #60a5fa;
      --border: #334155;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background-color: var(--bg);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .card {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 2.5rem 2rem;
      box-shadow: 0 4px 12px -2px rgba(0, 0, 0, 0.06);
    }

    h1 {
      margin: 0 0 0.4rem;
      font-size: 1.6rem;
      font-weight: 650;
      letter-spacing: -0.01em;
    }

    .tagline {
      margin: 0 0 1.5rem;
      color: var(--text-muted);
      line-height: 1.6;
      font-size: 0.98rem;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .links a {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-main);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: border-color 0.15s, color 0.15s;
    }

    .links a:hover,
    .links a:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }

    .links a span.hint {
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 400;
    }

    footer {
      margin-top: 1.75rem;
      color: var(--text-muted);
      font-size: 0.8rem;
    }

    @media (max-width: 380px) {
      .card { padding: 2rem 1.25rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Andy Borthwick</h1>
    <p class="tagline">Welcome. This is my personal page. Get in touch or find me on the platforms below.</p>

    <ul class="links">
      <li><a href="https://www.linkedin.com/in/andrewborthwick/" target="_blank" rel="noopener noreferrer">LinkedIn <span class="hint">Professional profile</span></a></li>
      <li><a href="https://github.com/andyborthwick" target="_blank" rel="noopener noreferrer">GitHub <span class="hint">Code and projects</span></a></li>
      <li><a href="mailto:andy@aborthwick.com">Email <span class="hint">andy@aborthwick.com</span></a></li>
    </ul>

    <footer>&copy; <span id="year"></span> Andy Borthwick</footer>
  </main>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>
</body>
</html>
